[workspace]
resolver = "3"
members = ["crates/*"]
# The F0 spikes are throwaway prototypes with their own Cargo.lock.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
apifast-domain = { path = "crates/apifast-domain" }
apifast-template = { path = "crates/apifast-template" }
apifast-app = { path = "crates/apifast-app" }
apifast-storage-fs = { path = "crates/apifast-storage-fs" }
apifast-http = { path = "crates/apifast-http" }
apifast-history = { path = "crates/apifast-history" }
apifast-watch = { path = "crates/apifast-watch" }
apifast-log = { path = "crates/apifast-log" }
apifast-vault = { path = "crates/apifast-vault" }
apifast-query = { path = "crates/apifast-query" }
apifast-import = { path = "crates/apifast-import" }
apifast-ws = { path = "crates/apifast-ws" }
apifast-grpc = { path = "crates/apifast-grpc" }
apifast-script-js = { path = "crates/apifast-script-js" }
apifast-git = { path = "crates/apifast-git" }
apifast-git-contract = { path = "crates/apifast-git-contract" }

# External
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
# Pure Rust git (ADR 0014): what the integration needs, without networking.
gix = { version = "0.90.0", default-features = false, features = ["sha1", "status", "parallel"] }
hmac = "0.13.0"
md-5 = "0.11.0"
md4 = "0.11.0"
sha2 = "0.11.1"
keyring = "4.2.0"
zeroize = "1.9.1"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
oneyaml = "1.2.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
roxmltree = "0.21.2"
# `preserve_order`: imported specs keep the order of their paths and
# properties, and files written as JSON the order they were built in.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# The log: events everywhere through `tracing`; only apifast-log sets where
# they go (docs/14).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# `log` records (wgpu, winit, arboard) reach tracing through tracing-log, with
# apifast-log's explanations of the known harmless warnings in between.
log = { version = "0.4.35", default-features = false, features = ["std"] }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "registry", "tracing-log"] }

# Tests
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Debug builds: only line tables for our crates, none for dependencies, and
# kept out of the executables (`unpacked`), so the many test binaries stay
# small and link fast. Backtraces still show our files and lines.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
