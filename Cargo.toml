[workspace]
resolver = "3"
members = ["crates/*"]
# The F0 spikes are throwaway prototypes with their own Cargo.lock.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
apifast-domain = { path = "crates/apifast-domain" }
apifast-template = { path = "crates/apifast-template" }
apifast-app = { path = "crates/apifast-app" }
apifast-storage-fs = { path = "crates/apifast-storage-fs" }
apifast-http = { path = "crates/apifast-http" }
apifast-history = { path = "crates/apifast-history" }
apifast-watch = { path = "crates/apifast-watch" }
apifast-vault = { path = "crates/apifast-vault" }

# External
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
zeroize = "1.9.1"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
oneyaml = "1.2.0"
serde_json = "1.0.154"
thiserror = "2.0.21"

# Tests
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
