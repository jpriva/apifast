[package]
name = "apifast-gui"
# Also the summary of the Linux packages (packaging/linux).
description = "Test APIs from collections kept as files: desktop interface and command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apifast-gui"
path = "src/main.rs"

# The build script lists the dependencies and their licenses for the
# About window, from `cargo metadata`.
[build-dependencies]
serde_json.workspace = true

# The executable's icon and version details
# (../apifast-cli/build_resources.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dependencies]
dunce.workspace = true
apifast-domain.workspace = true
apifast-template.workspace = true
apifast-history.workspace = true
apifast-http.workspace = true
apifast-ws.workspace = true
# git, behind the `git` feature (on by default): without it, gix is not
# built and the collection's repository is not read.
apifast-git = { workspace = true, optional = true }
apifast-script-js.workspace = true
# gRPC, behind the `grpc` feature (on by default): without it, gRPC
# requests open and save but say they cannot be called.
apifast-grpc = { workspace = true, optional = true }
apifast-import.workspace = true
apifast-storage-fs.workspace = true
apifast-watch.workspace = true
apifast-vault.workspace = true
apifast-app.workspace = true
apifast-query.workspace = true
apifast-log.workspace = true
tracing.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wayland", "x11", "accesskit", "clipboard", "wgpu"] }
rfd = "0.18.0"
# The editor's panes, dragged and split (ADR 0015).
egui_tiles = "0.18.0"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }

# On Wayland the window draws its own title bar (GNOME has no server-side
# ones): winit's Adwaita bar, with its buttons and round corners, instead of
# its fallback of plain squares. eframe takes winit without its defaults.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[features]
default = ["grpc", "git"]
grpc = ["dep:apifast-grpc"]
git = ["dep:apifast-git"]

# Linux packages (packaging/linux/README.md): one `apifast` package with
# the interface and the command line, built by packaging/linux/build.sh.
# What the interface loads at run time (Vulkan or EGL, Wayland or X11,
# xkbcommon) is recommended: it links only the C library.
[package.metadata.deb]
name = "apifast"
maintainer = "tryxtek <apifast@tryxtek.com>"
copyright = "apifast contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
A native, lightweight client for testing HTTP, GraphQL, WebSocket and gRPC \
APIs. Collections are plain YAML files, compatible with Bruno, so they live \
in git like code. Includes the apifast command line."""
section = "devel"
priority = "optional"
# Release builds are made on the oldest supported system (Ubuntu 22.04,
# glibc 2.35); a package built elsewhere needs that system's glibc.
depends = "libc6 (>= 2.35), libxkbcommon0"
recommends = "libvulkan1 | libegl1, libwayland-client0 | libx11-6, libwayland-egl1, libx11-xcb1, libxcursor1, libxi6, libxkbcommon-x11-0"
assets = [
    ["target/release/apifast-gui", "usr/bin/", "755"],
    ["target/release/apifast", "usr/bin/", "755"],
    ["../../packaging/linux/com.tryxtek.apifast.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/com.tryxtek.apifast.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/hicolor/scalable/apps/com.tryxtek.apifast.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/16x16/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/24x24/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/32x32/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/48x48/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/64x64/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/128x128/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/256x256/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/linux/icons/hicolor/512x512/apps/com.tryxtek.apifast.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/apifast/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/apifast/", "644"],
]

[package.metadata.generate-rpm]
name = "apifast"
# cargo-generate-rpm takes one text for the summary and the description.
summary = "Test APIs from collections kept as files"
license = "MIT OR Apache-2.0"
url = "https://github.com/jpriva/apifast"
assets = [
    { source = "target/release/apifast-gui", dest = "/usr/bin/apifast-gui", mode = "755" },
    { source = "target/release/apifast", dest = "/usr/bin/apifast", mode = "755" },
    { source = "../../packaging/linux/com.tryxtek.apifast.desktop", dest = "/usr/share/applications/com.tryxtek.apifast.desktop", mode = "644" },
    { source = "../../packaging/linux/com.tryxtek.apifast.metainfo.xml", dest = "/usr/share/metainfo/com.tryxtek.apifast.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/scalable/apps/com.tryxtek.apifast.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.tryxtek.apifast.svg", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/16x16/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/24x24/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/32x32/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/48x48/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/64x64/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/128x128/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/256x256/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../packaging/linux/icons/hicolor/512x512/apps/com.tryxtek.apifast.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.tryxtek.apifast.png", mode = "644" },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/apifast/LICENSE-MIT", mode = "644", doc = true },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/apifast/LICENSE-APACHE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = "*"
libxkbcommon = "*"

[package.metadata.generate-rpm.recommends]
vulkan-loader = "*"
mesa-libEGL = "*"
libwayland-client = "*"
libwayland-egl = "*"
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libxkbcommon-x11 = "*"

[lints]
workspace = true

[dev-dependencies]
# `wgpu` and `snapshot` draw the interface for the screenshot tests
# (tests/gui/snapshots.rs).
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
apifast-git-contract.workspace = true
tempfile.workspace = true
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# A local gRPC server for the core's tests.
tonic = { version = "0.14.9", default-features = false, features = ["server", "router"] }
tonic-prost = "0.14.9"
prost = { version = "0.14.6", default-features = false, features = ["std", "derive"] }
http = "1.5.0"
tower-service = "0.3.3"
tokio-stream = { version = "0.1.17", default-features = false, features = ["net"] }
tokio = { version = "1.54.1", features = ["rt", "net", "macros"] }
