opencollection: 1.0.0

info:
  name: prueba-ignore-apifast
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: accept
      value: application/json
    - name: x-prueba
      value: "1"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
      - .apifast
