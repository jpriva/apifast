info:
  name: Listar usuarios
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/get?x=1"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  params:
    - name: x
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
