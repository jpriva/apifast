[package]
name = "apifast-http"
description = "HTTP transport of apifast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apifast-domain.workspace = true
apifast-app.workspace = true
apifast-template.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "gzip", "brotli", "zstd", "deflate", "stream", "multipart", "socks"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The platform verifier reqwest uses, now given to it in our own rustls
# configuration, which also marks when each TLS handshake starts.
rustls-platform-verifier = "0.7.1"
# To wrap reqwest's connector and time each new connection.
tower-layer = "0.3.3"
tower-service = "0.3.3"
# Response bodies are decompressed by hand, to know both sizes. The same
# decoders reqwest's decompression used.
flate2 = "1.1.11"
brotli-decompressor = "6.3.1"
zstd = { version = "0.14.4", default-features = false }
tokio = { version = "1.54.1", features = ["time", "fs", "macros", "net", "io-util", "rt"] }
# For the raw connections gRPC speaks HTTP/2 over (`stream`).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3.34", default-features = false }
form_urlencoded = "1.2.2"
hmac.workspace = true
md-5.workspace = true
md4.workspace = true
base64.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
apifast-template.workspace = true
brotli = "9.1.1"
base64.workspace = true
hmac.workspace = true
md-5.workspace = true
md4.workspace = true
tempfile.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
