[package]
name = "apifast-http"
description = "HTTP transport of apifast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apifast-domain.workspace = true
apifast-app.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "gzip", "brotli", "zstd", "deflate", "stream", "multipart"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["time", "fs", "macros"] }
futures-util = { version = "0.3.34", default-features = false }
form_urlencoded = "1.2.2"

[lints]
workspace = true

[dev-dependencies]
apifast-template.workspace = true
flate2 = "1.1.11"
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
