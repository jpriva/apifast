[package]
name = "apifast-cli"
description = "Command line of apifast and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apifast"
path = "src/main.rs"

[dependencies]
apifast-domain.workspace = true
apifast-template.workspace = true
apifast-app.workspace = true
apifast-storage-fs.workspace = true
apifast-http.workspace = true
apifast-history.workspace = true
apifast-vault.workspace = true
apifast-import.workspace = true
apifast-ws.workspace = true
apifast-script-js.workspace = true
apifast-log.workspace = true
# git, behind the `git` feature (on by default): without it, gix is not
# built and the collection's repository is not read.
apifast-git = { workspace = true, optional = true }
# gRPC, behind the `grpc` feature (on by default): without it, gRPC
# requests open and save but say they cannot be called.
apifast-grpc = { workspace = true, optional = true }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt", "time", "signal", "macros"] }

[features]
default = ["grpc", "git"]
grpc = ["dep:apifast-grpc"]
git = ["dep:apifast-git"]

[lints]
workspace = true

[dev-dependencies]
apifast-git-contract.workspace = true
tempfile.workspace = true
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# A local gRPC server for the `send` tests.
tonic = { version = "0.14.9", default-features = false, features = ["server", "router"] }
tonic-prost = "0.14.9"
prost = { version = "0.14.6", default-features = false, features = ["std", "derive"] }
http = "1.5.0"
tower-service = "0.3.3"
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "net", "macros"] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["net"] }
