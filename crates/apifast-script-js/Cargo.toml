[package]
name = "apifast-script-js"
description = "JavaScript engine of apifast, on QuickJS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apifast-domain.workspace = true
apifast-app.workspace = true
serde_json.workspace = true
# `futures`: scripts may await; `parallel`: its runtime is `Send`, so a
# script runs on any tokio thread.
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "futures", "parallel"] }
tokio = { version = "1.54.1", features = ["time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
apifast-domain.workspace = true
