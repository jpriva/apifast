# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec security advisories (covers what cargo audit would check).
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0. Adding one needs a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla's root certificates (webpki-root-certs), a permissive data
    # license; rustls-platform-verifier falls back to them.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list covers planned dependencies, not only the current ones.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
