allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
doc-valid-idents = ["OpenCollection", "OpenAPI", "GraphiQL", "GraphQL", "JSONPath", "XPath", "JUnit", "SigV4", "NTLM", "NTLMv2", ".."]
disallowed-methods = [
    # `ui.set_visuals(..)` compiles through `Deref<Target = Context>` and changes the
    # whole app from the next frame. Use `*ui.visuals_mut() = ..` for a scope, or
    # `theme::install` for the app.
    { path = "egui::Context::set_visuals", reason = "use `*ui.visuals_mut() = ..` or `theme::install`" },
]
