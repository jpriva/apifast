name: Packages

# The Linux packages (packaging/linux): built on the oldest system they
# support, so they run on it and anything newer, and kept as an artifact of
# the run. Nothing is published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "crates/apifast-gui/Cargo.toml"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb, .rpm, AppImage)
    # Ubuntu 22.04: glibc 2.35, the oldest the packages promise.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: A tag names the version being packaged
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "apifast-gui") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version" >&2
            exit 1
          fi
      - name: Desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/com.tryxtek.apifast.desktop
          appstreamcli validate --no-net packaging/linux/com.tryxtek.apifast.metainfo.xml
      - run: packaging/linux/build.sh
      - name: AppImage
        env:
          # The runners may have no FUSE for appimagetool, an AppImage itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          eval "$(packaging/linux/appimage/tools.sh)"
          export APPIMAGETOOL APPIMAGE_RUNTIME
          packaging/linux/appimage/build.sh
          ln -s "$PWD"/target/packages/apifast-*-x86_64.AppImage target/apifast
          target/apifast --version
      - run: packaging/linux/check-glibc.sh 2.35
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: target/packages/*
          if-no-files-found: error
